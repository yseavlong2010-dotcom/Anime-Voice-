name: Build Pro iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Compile Full Tweak
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -O3 -Wall -Wextra -fPIC -dynamiclib -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=14.0 -install_name @rpath/AnimeVoice_Pro.dylib anime_voice.c -o AnimeVoice_Pro.dylib

      - name: Upload Pro Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVoicePro-dylib
          path: AnimeVoice_Pro.dylib
