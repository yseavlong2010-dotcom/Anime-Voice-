name: Build Pro iOS Dylib
on:
push:
branches: [ main, master ]
workflow_dispatch:
jobs:
build:
runs-on: macos-latest
steps:
- name: Checkout source code
uses: actions/checkout@v4
- name: Compile using Makefile
run: make
- name: Upload Pro Dylib Artifact
uses: actions/upload-artifact@v4
with:
name: AnimeVoicePro-dylib
path: AnimeVoice_Pro.dylib